<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Connect4Society Registration</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }

        body {
            min-height: 100vh;
            background: #f4f7f6;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 18px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 25px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 6px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 15px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 14px;
            border: none;
            border-radius: 8px;
            background: #111;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #333;
        }

        .success {
            display: none;
            text-align: center;
            margin-top: 25px;
            padding: 20px;
            background: #f0f8f2;
            border-radius: 10px;
        }

        .quote {
            margin-top: 15px;
            font-style: italic;
            color: #333;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Connect4Society</h1>

    <p class="subtitle">
        Student Social Work Registration
    </p>

    <form id="registrationForm">

        <label>Name [USN]</label>
        <input
            type="text"
            id="name"
            placeholder="Enter your name and USN"
            required
        >

        <label>College Name</label>
        <input
            type="text"
            id="college"
            placeholder="Enter your college name"
            required
        >

        <label>E-mail ID</label>
        <input
            type="email"
            id="email"
            placeholder="Enter your email"
            required
        >

        <label>Contact Number</label>
        <input
            type="tel"
            id="contact"
            placeholder="Enter your 10-digit number"
            required
        >

        <button type="submit">
            Register for Social Work
        </button>

    </form>

    <div class="success" id="successMessage">

        <h2>Thank You! ❤️</h2>

        <p>
            Your registration has been successfully submitted.
        </p>

        <p class="quote" id="quote"></p>

    </div>

</div>

<script>

const quotes = [
    "Small acts of kindness can create a big change.",
    "Service to others is one of the most meaningful things we can do.",
    "Be the reason someone believes in kindness again.",
    "Together, small efforts can create a stronger community.",
    "Your time and kindness can make someone's day better.",
    "A helping hand can make a difficult journey easier.",
    "Social work begins with caring about people around us.",
    "Every positive action creates a ripple of change.",
    "The world becomes better when we choose to help each other.",
    "Your contribution matters more than you think."
];

document.getElementById("registrationForm").addEventListener("submit", function(event) {

    event.preventDefault();

    const randomQuote =
        quotes[Math.floor(Math.random() * quotes.length)];

    document.getElementById("quote").textContent =
        "“" + randomQuote + "”";

    document.getElementById("registrationForm").style.display = "none";

    document.getElementById("successMessage").style.display = "block";

});

</script>

</body>
</html>
