<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Connect4Society | Social Work Registration</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #f5f7fa, #e8f5e9);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 500px;
      background: white;
      padding: 30px;
      border-radius: 18px;
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.12);
    }

    .logo {
      text-align: center;
      font-size: 28px;
      font-weight: bold;
      color: #16803c;
      margin-bottom: 8px;
    }

    .subtitle {
      text-align: center;
      color: #555;
      margin-bottom: 25px;
      font-size: 15px;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 7px;
      color: #333;
    }

    input {
      width: 100%;
      padding: 13px;
      margin-bottom: 18px;
      border: 1px solid #ccc;
      border-radius: 9px;
      font-size: 15px;
      outline: none;
    }

    input:focus {
      border-color: #16803c;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 9px;
      background: #16803c;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #126b32;
    }

    button:disabled {
      background: #999;
      cursor: not-allowed;
    }

    .success {
      display: none;
      text-align: center;
      margin-top: 20px;
    }

    .success h2 {
      color: #16803c;
      margin-bottom: 15px;
    }

    .quote {
      font-size: 18px;
      line-height: 1.5;
      color: #444;
      font-style: italic;
      margin-top: 10px;
    }

    .footer {
      text-align: center;
      margin-top: 25px;
      color: #777;
      font-size: 13px;
    }
  </style>
</head>

<body>

  <div class="container">

    <div class="logo">
      Connect4Society
    </div>

    <div class="subtitle">
      Register for Social Work & Community Activities
    </div>

    <form id="registrationForm">

      <label for="name">Name [USN]</label>
      <input
        type="text"
        id="name"
        placeholder="Enter your name and USN"
        required
      >

      <label for="college">College Name</label>
      <input
        type="text"
        id="college"
        placeholder="Enter your college name"
        required
      >

      <label for="email">E-mail ID</label>
      <input
        type="email"
        id="email"
        placeholder="Enter your email"
        required
      >

      <label for="contact">Contact Number</label>
      <input
        type="tel"
        id="contact"
        placeholder="Enter your contact number"
        required
      >

      <button type="submit" id="submitButton">
        Register for Social Work
      </button>

    </form>

    <div class="success" id="successMessage">

      <h2>Registration Successful! 🎉</h2>

      <p>
        Thank you for registering for social work.
      </p>

      <p class="quote" id="quote"></p>

    </div>

    <div class="footer">
      Connect4Society • Making a difference together
    </div>

  </div>


  <script>

    // ==========================================
    // GOOGLE APPS SCRIPT BACKEND URL
    // ==========================================

    const BACKEND_URL =
      "https://script.google.com/macros/s/AKfycbyUIJZTztzSYD7-DXWmRvlpBlcps2XM3U5ALdlzF5xS9G51Ssisu1WbiXbODvZLbzgl/exec";


    // ==========================================
    // FORM SUBMISSION
    // ==========================================

    document
      .getElementById("registrationForm")
      .addEventListener("submit", async function(event) {

        event.preventDefault();

        const name =
          document.getElementById("name").value.trim();

        const college =
          document.getElementById("college").value.trim();

        const email =
          document.getElementById("email").value.trim();

        const contact =
          document.getElementById("contact").value.trim();

        const button =
          document.getElementById("submitButton");


        // Disable button while submitting
        button.disabled = true;
        button.textContent = "Submitting...";


        try {

          const response = await fetch(
            BACKEND_URL,
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "text/plain;charset=utf-8"
              },

              body: JSON.stringify({
                name: name,
                college: college,
                email: email,
                contact: contact
              })
            }
          );


          const result =
            await response.json();


          // ==========================================
          // SUCCESS
          // ==========================================

          if (result.success) {

            document
              .getElementById("quote")
              .textContent =
              "“" + result.message + "”";

            document
              .getElementById("registrationForm")
              .style.display = "none";

            document
              .getElementById("successMessage")
              .style.display = "block";

          }


          // ==========================================
          // SERVER ERROR
          // ==========================================

          else {

            alert(result.message);

            button.disabled = false;
            button.textContent =
              "Register for Social Work";
          }

        }


        // ==========================================
        // CONNECTION ERROR
        // ==========================================

        catch (error) {

          console.error(error);

          alert(
            "Unable to submit the registration. " +
            "Please check your internet connection and try again."
          );

          button.disabled = false;

          button.textContent =
            "Register for Social Work";
        }

      });

  </script>

</body>
</html>
</script>

</body>
</html>
